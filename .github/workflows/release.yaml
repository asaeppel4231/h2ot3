name: Build Release

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y cmake gcc libxcb1-dev libx11-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install cmake

    - name: Configure CMake (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -DYASTK_BUILD_TESTS=OFF \
          -DH2OT3_BUILD_SHARED=ON \
          -DH2OT3_BUILD_TESTCODE=ON \
          -DH2OT3_BACKEND_SUPPORT_XCB=ON \
          -DH2OT3_BACKEND_SUPPORT_COCOA=OFF \
          -DH2OT3_BACKEND_SUPPORT_WIN32=OFF

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -DYASTK_BUILD_TESTS=OFF \
          -DH2OT3_BUILD_SHARED=ON \
          -DH2OT3_BUILD_TESTCODE=ON \
          -DH2OT3_BACKEND_SUPPORT_XCB=OFF \
          -DH2OT3_BACKEND_SUPPORT_COCOA=ON \
          -DH2OT3_BACKEND_SUPPORT_WIN32=OFF

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -DYASTK_BUILD_TESTS=OFF \
          -DH2OT3_BUILD_SHARED=ON \
          -DH2OT3_BUILD_TESTCODE=ON \
          -DH2OT3_BACKEND_SUPPORT_XCB=OFF \
          -DH2OT3_BACKEND_SUPPORT_COCOA=OFF \
          -DH2OT3_BACKEND_SUPPORT_WIN32=ON

    - name: Build
      run: cmake --build build --config Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: h2ot3-${{ matrix.os }}
        path: h2ot3-${{ matrix.os }}.*

