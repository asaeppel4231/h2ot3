name: Build Release

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y cmake gcc libxcb1-dev libx11-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install cmake

    - name: Configure CMake
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DH2OT3_BUILD_SHARED=ON \
            -DH2OT3_BUILD_TESTCODE=ON \
            -DH2OT3_BACKEND_SUPPORT_COCOA=ON \
            -DH2OT3_BACKEND_SUPPORT_XCB=OFF \
            -DH2OT3_BACKEND_SUPPORT_WIN32=OFF
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DH2OT3_BUILD_SHARED=ON \
            -DH2OT3_BUILD_TESTCODE=ON \
            -DH2OT3_BACKEND_SUPPORT_COCOA=OFF \
            -DH2OT3_BACKEND_SUPPORT_XCB=ON \
            -DH2OT3_BACKEND_SUPPORT_WIN32=OFF
        else
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DH2OT3_BUILD_SHARED=ON \
            -DH2OT3_BUILD_TESTCODE=ON \
            -DH2OT3_BACKEND_SUPPORT_COCOA=OFF \
            -DH2OT3_BACKEND_SUPPORT_XCB=OFF \
            -DH2OT3_BACKEND_SUPPORT_WIN32=ON
        fi

    - name: Build
      run: cmake --build build --config Release

    - name: Compress artifacts (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        LIBFILE=$(find build -maxdepth 3 -type f \( -name "*.so" -o -name "*.dylib" \))
        echo "Found library: $LIBFILE"
        xz -9 $LIBFILE
        mv ${LIBFILE}.xz h2ot3-${{ matrix.os }}.xz

    - name: Compress artifacts (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $lib = Get-ChildItem -Recurse -Filter *.dll | Select-Object -First 1
        Write-Host "Found library: $($lib.FullName)"
        tar -cJf h2ot3-${{ matrix.os }}.tar.xz $($lib.FullName)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: h2ot3-${{ matrix.os }}
        path: h2ot3-${{ matrix.os }}.*

