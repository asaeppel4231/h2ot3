name: Build h2ot3

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake gcc libxcb1-dev libx11-dev

    - name: Configure CMake
      run: cmake -S . -B build -DBUILD_TESTING=OFF -DYASTK_BUILD_TESTS=OFF

    - name: Build
      run: cmake --build build --config Release
